import java.text.SimpleDateFormat
plugins {
	id 'com.android.application'
}

def appVersion = new Properties()
rootProject.file('version.properties').withInputStream { appVersion.load(it) }

def signingValues = ['ANDROID_KEYSTORE_PATH', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
        .collectEntries { name -> [(name): System.getenv(name)] }
def hasReleaseSigning = signingValues.values().every { it != null && !it.isEmpty() }
if (signingValues.values().any { it != null && !it.isEmpty() } && !hasReleaseSigning) {
    throw new GradleException('Release signing requires all four ANDROID_* signing environment variables.')
}

android {
	namespace = 'com.gukos.bokotan'
	// This module contains Java sources only.
	enableKotlin = false
	compileSdk = 36

	defaultConfig {
		applicationId = "com.gukos.bokotan"
		minSdk = 26
		targetSdk = 36
		versionCode = appVersion.getProperty('VERSION_CODE').toInteger()
		versionName = appVersion.getProperty('VERSION_NAME')

		testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

		//https://takusan.negitoro.dev/posts/android_build_date_resource/
		// ビルド日時を Context#getString で参照できるようにする
		resValue("string", "buildDate", new SimpleDateFormat("yyMMdd.Hmm").format(Calendar.getInstance(Locale.JAPAN).getTime()))
	}

	signingConfigs {
		if (hasReleaseSigning) {
			release {
				storeFile = file(signingValues.ANDROID_KEYSTORE_PATH)
				storePassword = signingValues.ANDROID_KEYSTORE_PASSWORD
				keyAlias = signingValues.ANDROID_KEY_ALIAS
				keyPassword = signingValues.ANDROID_KEY_PASSWORD
			}
		}
	}

	buildTypes {
		release {
			if (hasReleaseSigning) signingConfig = signingConfigs.release
			minifyEnabled = false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
	}
	androidResources {
		noCompress += ["btv"]
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_11
		targetCompatibility JavaVersion.VERSION_11
	}


	//bindingを使うため
	buildFeatures {
		dataBinding = true
		buildConfig = true
		resValues = true
	}

	sourceSets {
		// Licensed sample vocabulary and recordings are available in every APK/AAB.
		main.assets.srcDirs = [rootProject.file('samples/free-vocabulary/assets')]
	}
}

dependencies {
	implementation 'androidx.appcompat:appcompat:1.7.1'
	implementation 'com.google.android.material:material:1.13.0'
	testImplementation 'junit:junit:4.13.2'
	androidTestImplementation 'androidx.test.ext:junit:1.3.0'
	androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

// Keep compiler diagnostics visible so new deprecated or unsafe calls are caught in CI.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}
