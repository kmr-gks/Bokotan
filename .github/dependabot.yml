version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # androidx.core 1.19+ requires compileSdk 37. Remove this rule when compileSdk is raised.
      - dependency-name: 'androidx.core:core'
        versions: ['>= 1.19.0']
    groups:
      androidx-material-test:
        patterns:
          - 'androidx.*'
          - 'com.google.android.material:*'
          - 'junit:junit'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
