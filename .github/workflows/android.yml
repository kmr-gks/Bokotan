name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Read version
        run: cat version.properties >> "$GITHUB_ENV"
      - name: Test and build APKs and AABs
        run: >-
          bash gradlew --no-daemon --warning-mode all
          testDebugUnitTest lintDebug assembleDebug bundleDebug assembleRelease bundleRelease
      - name: Upload installable sample APK and debug AAB
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bokotan-${{ env.VERSION_NAME }}-debug-sample
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/debug/*.aab
            samples/free-vocabulary/data/
            samples/free-vocabulary/README.txt
            samples/free-vocabulary/sources.json
            samples/free-vocabulary/licenses/
      - name: Upload unsigned release APK and AAB
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bokotan-${{ env.VERSION_NAME }}-release-unsigned
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*
