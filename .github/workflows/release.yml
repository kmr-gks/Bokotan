name: Signed Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version and release tag
        shell: bash
        run: |
          set -euo pipefail
          source version.properties
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          [[ "$VERSION_NAME" =~ ^[0-9]+(\.[0-9]+)+$ ]]
          RELEASE_TAG="v${VERSION_NAME}"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]]; then
            echo 'The tag must match VERSION_NAME in version.properties.' >&2
            exit 1
          fi
          if git rev-parse --verify "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            if [[ "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" != "$(git rev-parse HEAD)" ]]; then
              echo 'The version tag already points to a different commit. Increase the version first.' >&2
              exit 1
            fi
          fi
          printf 'VERSION_NAME=%s\nRELEASE_TAG=%s\n' "$VERSION_NAME" "$RELEASE_TAG" >> "$GITHUB_ENV"
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing repository secret: $name" >&2
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bokotan-release.jks"
          printf 'ANDROID_KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/bokotan-release.jks" >> "$GITHUB_ENV"
      - name: Test, lint, and build signed APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          bash gradlew --no-daemon --warning-mode all --no-configuration-cache
          testDebugUnitTest lintDebug assembleRelease bundleRelease
      - name: Verify signatures and prepare downloads
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
          jarsigner -J-Duser.language=en -J-Duser.country=US -verify app/build/outputs/bundle/release/app-release.aab | tee "$RUNNER_TEMP/bundle-verification.txt"
          grep -F 'jar verified.' "$RUNNER_TEMP/bundle-verification.txt"
          mkdir -p release-files
          cp app/build/outputs/apk/release/app-release.apk "release-files/Bokotan-${VERSION_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release-files/Bokotan-${VERSION_NAME}.aab"
          (cd release-files && sha256sum *.apk *.aab > SHA256SUMS.txt)
      - name: Save signed build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bokotan-${{ env.VERSION_NAME }}-signed
          path: release-files/
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This release already exists. Increase the version before publishing again.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-files/* \
            --target "$GITHUB_SHA" --title "Bokotan ${VERSION_NAME}" --generate-notes
      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/bokotan-release.jks"
