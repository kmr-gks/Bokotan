name: Publish Privacy Policy

on:
  push:
    branches: [main]
    paths:
      - 'site/privacy-policy/**'
      - 'scripts/render_privacy_policy.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/privacy-policy/**'
      - 'scripts/render_privacy_policy.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privacy-policy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Render privacy policy
        run: python3 scripts/render_privacy_policy.py
      - name: Prepare public files only
        run: |
          mkdir -p _site
          cp site/privacy-policy/index.html site/privacy-policy/privacy-policy.html site/privacy-policy/.nojekyll _site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
