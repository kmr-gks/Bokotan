name: Publish Privacy Policy

on:
  push:
    branches: [main]
    paths:
      - 'site/privacy-policy/**'
      - 'scripts/render_privacy_policy.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/privacy-policy/**'
      - 'scripts/render_privacy_policy.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privacy-policy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Render privacy policy
        run: python3 scripts/render_privacy_policy.py
      - name: Prepare public files only
        run: |
          mkdir -p _site
          cp site/privacy-policy/index.html site/privacy-policy/privacy-policy.html site/privacy-policy/.nojekyll _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
